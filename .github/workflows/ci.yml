name: CI

on:
  pull_request:
    branches: [rebuild, main, 'feat/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      # The site with no live data at all: every page still builds and shows no empty shell.
      - run: pnpm build:empty
      - run: pnpm build-storybook
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:stories
